{% extends  "base.html" %}

{% block content %}
<div class="d-flex flex-wrap" style="padding-top:100px;">
    <a class="btn btn-primary" href="{% url 'package:category_new' %}" style=" float:right;">Create Category</a>

</div>
<!-- category Section -->

<div class="container" style="padding-bottom:60px;">
    <h2>Category</h2>
    <div class="project-wrapper">
        {% for category in category_list %}
        <div class="testimonial">
            <div class="testimonial-content">
                <i class="fas fa-user testimonial-icon"></i>
                <div class="testimonial-text">

                    <footer>{{category.name}}</footer>
                    <blockquote>
                        <p>
                        <img src={{category.image.url}}>
                        </p>
                    </blockquote>
                    {% if user.is_authenticated and user.is_superuser %}

                    <a class="btn btn-primary" href="{% url 'package:category_edit' pk=category.pk %}">
                        <i class="bi bi-pen"></i> Edit
                    </a>


                    <a class="btn btn-primary" href="{% url 'package:category_remove' pk=category.pk %}"><i
                            class="bi bi-file-earmark-x"></i>Delete</a>


                    {% endif %}

                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>


{% endblock %}
